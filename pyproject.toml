[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surgical-embeddings"
version = "1.0.2"
description = "Generate and visualize embeddings for surgical and medical terms."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mahitha Simhambhatla", email = "msimham@utexas.edu" },
    { name = "Lichy Han", email = "lhan2@stanford.edu" },
]
keywords = [
    "embeddings",
    "machine-learning",
    "medical",
    "natural-language-processing",
    "surgery",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "sentence-transformers>=5.1.2",
    "torch>=2.13.0",
    "tqdm>=4.69.0",
    "transformers>=5.14.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/mahisimham/SurgicalEmbeddings"
Issues = "https://github.com/mahisimham/SurgicalEmbeddings/issues"
Repository = "https://github.com/mahisimham/SurgicalEmbeddings.git"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surgical_embeddings = ["pca_models/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
