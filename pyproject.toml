[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surgical-embeddings"
version = "0.1.0"
description = "Generate and visualize embeddings for surgical and medical terms."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Mahitha Simhambhatla", email = "msimham@utexas.edu" },
    { name = "Lichy Han", email = "lhan2@stanford.edu" },
]
keywords = [
    "embeddings",
    "machine-learning",
    "medical",
    "natural-language-processing",
    "surgery",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "tqdm>=4.60",
    "transformers>=4.40",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/mahisimham/SurgicalEmbeddings"
Issues = "https://github.com/mahisimham/SurgicalEmbeddings/issues"
Repository = "https://github.com/mahisimham/SurgicalEmbeddings.git"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
surgical_embeddings = ["pca_models/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
